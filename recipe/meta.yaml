{% set version = "13.4.2" %}

package:
  name: cuda-libraries
  version: {{ version }}

source:
  url: https://developer.download.nvidia.com/compute/cuda/redist/cuda_documentation/LICENSE.txt
  sha256: e2c71babfd18a8e69542dd7e9ca018f9caa438094001a58e6bc4d8c999bf0d07

build:
  number: 0
  skip: true  # [osx or ppc64le]

requirements:
  run:
    - cuda-cudart 13.4.92
    - cuda-nvrtc 13.4.92
    - cuda-opencl 13.4.92    # [linux64 or win]
    - libcublas 13.8.0.4
    - libcudla 13.4.92     # [(linux and aarch64) or (win and arm64)]
    - libcufft 12.4.0.43
    - libcufile 1.19.1.55       # [linux]
    - libcuobjclient 1.3.1.55  # [linux64 or aarch64]
    - libcurand 10.4.4.72
    - libcusolver 12.3.4.7
    - libcusparse 12.8.6.72
    - libnpp 13.2.0.58
    - libnvfatbin 13.4.92
    - libnvjitlink 13.4.92
    - libnvjpeg 13.2.3.58

test:
  commands:
    - exit 0

about:
  home: https://developer.nvidia.com/cuda-toolkit
  license_file: LICENSE.txt
  license: LicenseRef-NVIDIA-End-User-License-Agreement
  license_url: https://docs.nvidia.com/cuda/eula/index.html
  summary: Meta-package containing all available library runtime packages.
  description: |
    Meta-package containing all available library runtime packages.
  doc_url: https://docs.nvidia.com/cuda/index.html

extra:
  recipe-maintainers:
    - conda-forge/cuda
