{% set version = "13.5.0" %}

package:
  name: cuda-libraries
  version: {{ version }}

source:
  url: https://developer.download.nvidia.com/compute/cuda/redist/cuda_documentation/LICENSE.txt
  sha256: e2c71babfd18a8e69542dd7e9ca018f9caa438094001a58e6bc4d8c999bf0d07

build:
  number: 0
  skip: true  # [osx or ppc64le]

requirements:
  run:
    - cuda-cudart 13.5.37
    - cuda-nvrtc 13.5.37
    - cuda-opencl 13.5.25    # [linux64 or win]
    - libcublas 13.10.0.20
    - libcudla 13.5.25     # [(linux and aarch64) or (win and arm64)]
    - libcufft 12.5.0.14
    - libcufile 1.20.0.107       # [linux]
    - libcuobjclient 1.4.0.107  # [linux64 or aarch64]
    - libcurand 10.4.5.25
    - libcusolver 12.4.1.2
    - libcusparse 12.9.4.2
    - libnpp 13.2.0.93
    - libnvfatbin 13.5.37
    - libnvjitlink 13.5.37
    - libnvjpeg 13.3.2.43

test:
  commands:
    - exit 0

about:
  home: https://developer.nvidia.com/cuda-toolkit
  license_file: LICENSE.txt
  license: LicenseRef-NVIDIA-End-User-License-Agreement
  license_url: https://docs.nvidia.com/cuda/eula/index.html
  summary: Meta-package containing all available library runtime packages.
  description: |
    Meta-package containing all available library runtime packages.
  doc_url: https://docs.nvidia.com/cuda/index.html

extra:
  recipe-maintainers:
    - conda-forge/cuda
